<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Output-stationary (OS)</title><desc id="desc">Một PE giữ tổng từng phần của một phần tử đầu ra, nhận các tap trọng số và kích hoạt đến khi hoàn tất.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#314968"/></marker></defs>
<style>.heading{font:600 23px Arial,sans-serif;fill:#172b4d}.title{font:600 17px Arial,sans-serif;fill:#172b4d}.sub{font:14px Arial,sans-serif;fill:#334155}.label{font:14px Arial,sans-serif;fill:#334155}.foot{font:14px Arial,sans-serif;fill:#334155}</style>
<rect width="1000" height="300" rx="18" fill="#f7f9fc"/>
<text x="30" y="42" class="heading">Output-stationary (OS)</text>
<rect x="28" y="90" width="190" height="82" rx="12" fill="#e4f1ff" stroke="#324867" stroke-width="1.5"/><text x="123" y="121" text-anchor="middle" class="title">BRAM trọng số</text><text x="123" y="146" text-anchor="middle" class="sub">phát W theo tap</text><rect x="28" y="180" width="190" height="82" rx="12" fill="#e7f8ec" stroke="#324867" stroke-width="1.5"/><text x="123" y="211" text-anchor="middle" class="title">Kích hoạt vào</text><text x="123" y="236" text-anchor="middle" class="sub">phát X theo tap</text><rect x="330" y="125" width="240" height="82" rx="12" fill="#fff0db" stroke="#324867" stroke-width="1.5"/><text x="450" y="156" text-anchor="middle" class="title">PE: psum cố định</text><text x="450" y="181" text-anchor="middle" class="sub">tích lũy 32-bit cục bộ</text><rect x="735" y="125" width="220" height="82" rx="12" fill="#f0e9ff" stroke="#324867" stroke-width="1.5"/><text x="845" y="156" text-anchor="middle" class="title">Feature map ra</text><text x="845" y="181" text-anchor="middle" class="sub">ghi một lần / output</text><path d="M218 132 L330 151" fill="none" stroke="#314968" stroke-width="2.2" marker-end="url(#arrow)"/><text x="274" y="122" text-anchor="middle" class="label">W</text><path d="M218 221 L330 181" fill="none" stroke="#314968" stroke-width="2.2" marker-end="url(#arrow)"/><text x="274" y="171" text-anchor="middle" class="label">X</text><path d="M570 166 L735 166" fill="none" stroke="#314968" stroke-width="2.2" marker-end="url(#arrow)"/><text x="652" y="156" text-anchor="middle" class="label">Y hoàn tất</text>
<text x="30" y="285" class="foot">Giảm ghi/đọc psum; lõi MAC nối tiếp hiện có gần cách giữ psum này.</text>
</svg>