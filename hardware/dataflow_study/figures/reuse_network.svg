<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Mạng tái sử dụng dữ liệu LeNet-5</title><desc id="desc">Trọng số và kích hoạt được phân phối từ BRAM đến cụm PE; tổng từng phần giữ trong thanh ghi rồi ghi lại.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#314968"/></marker></defs>
<style>.heading{font:600 23px Arial,sans-serif;fill:#172b4d}.title{font:600 17px Arial,sans-serif;fill:#172b4d}.sub{font:14px Arial,sans-serif;fill:#334155}.label{font:14px Arial,sans-serif;fill:#334155}.foot{font:14px Arial,sans-serif;fill:#334155}</style>
<rect width="1000" height="300" rx="18" fill="#f7f9fc"/>
<text x="30" y="42" class="heading">Mạng tái sử dụng dữ liệu LeNet-5</text>
<rect x="25" y="125" width="180" height="82" rx="12" fill="#e4f1ff" stroke="#324867" stroke-width="1.5"/><text x="115" y="156" text-anchor="middle" class="title">BRAM W INT8</text><text x="115" y="181" text-anchor="middle" class="sub">63.150 / 37.950 B</text><rect x="250" y="125" width="190" height="82" rx="12" fill="#e7f8ec" stroke="#324867" stroke-width="1.5"/><text x="345" y="156" text-anchor="middle" class="title">Cửa sổ 5×5</text><text x="345" y="181" text-anchor="middle" class="sub">X dùng cho nhiều filter</text><rect x="485" y="125" width="210" height="82" rx="12" fill="#fff0db" stroke="#324867" stroke-width="1.5"/><text x="590" y="156" text-anchor="middle" class="title">8 PE MAC</text><text x="590" y="181" text-anchor="middle" class="sub">multicast W / X</text><rect x="740" y="125" width="230" height="82" rx="12" fill="#f0e9ff" stroke="#324867" stroke-width="1.5"/><text x="855" y="156" text-anchor="middle" class="title">RF psum + BRAM</text><text x="855" y="181" text-anchor="middle" class="sub">chỉ ghi khi hoàn tất</text><path d="M205 166 L485 145" fill="none" stroke="#314968" stroke-width="2.2" marker-end="url(#arrow)"/><text x="345" y="135" text-anchor="middle" class="label">W theo tile</text><path d="M440 176 L485 177" fill="none" stroke="#314968" stroke-width="2.2" marker-end="url(#arrow)"/><text x="462" y="166" text-anchor="middle" class="label">X</text><path d="M695 166 L740 166" fill="none" stroke="#314968" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="30" y="285" class="foot">Chọn tile theo dung lượng M9K và số cổng đọc; không đồng nhất số MAC với số lần truy cập bộ nhớ.</text>
</svg>