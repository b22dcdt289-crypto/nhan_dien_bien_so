<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Weight-stationary (WS)</title><desc id="desc">Mỗi PE giữ trọng số trong thanh ghi và dùng nhiều lần; kích hoạt và tổng từng phần di chuyển.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#314968"/></marker></defs>
<style>.heading{font:600 23px Arial,sans-serif;fill:#172b4d}.title{font:600 17px Arial,sans-serif;fill:#172b4d}.sub{font:14px Arial,sans-serif;fill:#334155}.label{font:14px Arial,sans-serif;fill:#334155}.foot{font:14px Arial,sans-serif;fill:#334155}</style>
<rect width="1000" height="300" rx="18" fill="#f7f9fc"/>
<text x="30" y="42" class="heading">Weight-stationary (WS)</text>
<rect x="28" y="90" width="175" height="82" rx="12" fill="#e4f1ff" stroke="#324867" stroke-width="1.5"/><text x="115" y="121" text-anchor="middle" class="title">BRAM trọng số</text><text x="115" y="146" text-anchor="middle" class="sub">đọc W theo tile</text><rect x="28" y="180" width="175" height="82" rx="12" fill="#e7f8ec" stroke="#324867" stroke-width="1.5"/><text x="115" y="211" text-anchor="middle" class="title">Kích hoạt vào</text><text x="115" y="236" text-anchor="middle" class="sub">broadcast X</text><rect x="285" y="125" width="172" height="82" rx="12" fill="#fff0db" stroke="#324867" stroke-width="1.5"/><text x="371" y="156" text-anchor="middle" class="title">PE₀: W cố định</text><text x="371" y="181" text-anchor="middle" class="sub">MAC nhiều vị trí</text><rect x="485" y="125" width="172" height="82" rx="12" fill="#fff0db" stroke="#324867" stroke-width="1.5"/><text x="571" y="156" text-anchor="middle" class="title">PE₁: W cố định</text><text x="571" y="181" text-anchor="middle" class="sub">MAC nhiều vị trí</text><rect x="735" y="125" width="220" height="82" rx="12" fill="#f0e9ff" stroke="#324867" stroke-width="1.5"/><text x="845" y="156" text-anchor="middle" class="title">Tích lũy / output</text><text x="845" y="181" text-anchor="middle" class="sub">psum di chuyển</text><path d="M203 131 L285 153" fill="none" stroke="#314968" stroke-width="2.2" marker-end="url(#arrow)"/><text x="244" y="121" text-anchor="middle" class="label">W</text><path d="M203 220 L285 184" fill="none" stroke="#314968" stroke-width="2.2" marker-end="url(#arrow)"/><text x="244" y="174" text-anchor="middle" class="label">X</text><path d="M457 166 L485 166" fill="none" stroke="#314968" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M657 166 L735 166" fill="none" stroke="#314968" stroke-width="2.2" marker-end="url(#arrow)"/><text x="696" y="156" text-anchor="middle" class="label">psum</text>
<text x="30" y="285" class="foot">Tối ưu đọc lại W; phải bố trí đường truyền X và psum giữa PE / bộ đệm.</text>
</svg>