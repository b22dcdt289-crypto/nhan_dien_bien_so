<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Streaming và line buffer</title><desc id="desc">Một ảnh ký tự 32 nhân 32 đi qua bộ đệm và hai lớp tích chập; đường JTAG hiện tại nạp trọn frame trước khi tính.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#314968"/></marker></defs>
<style>.heading{font:600 23px Arial,sans-serif;fill:#172b4d}.title{font:600 17px Arial,sans-serif;fill:#172b4d}.sub{font:14px Arial,sans-serif;fill:#334155}.label{font:14px Arial,sans-serif;fill:#334155}.foot{font:14px Arial,sans-serif;fill:#334155}</style>
<rect width="1000" height="300" rx="18" fill="#f7f9fc"/>
<text x="30" y="42" class="heading">Streaming và line buffer</text>
<rect x="20" y="125" width="172" height="82" rx="12" fill="#e7f8ec" stroke="#324867" stroke-width="1.5"/><text x="106" y="156" text-anchor="middle" class="title">Nguồn 32×32</text><text x="106" y="181" text-anchor="middle" class="sub">JTAG hoặc pixel stream</text><rect x="225" y="125" width="170" height="82" rx="12" fill="#e4f1ff" stroke="#324867" stroke-width="1.5"/><text x="310" y="156" text-anchor="middle" class="title">Buffer vào</text><text x="310" y="181" text-anchor="middle" class="sub">1 KiB / ký tự</text><rect x="430" y="125" width="170" height="82" rx="12" fill="#fff0db" stroke="#324867" stroke-width="1.5"/><text x="515" y="156" text-anchor="middle" class="title">Conv1</text><text x="515" y="181" text-anchor="middle" class="sub">4×32 byte line buffer</text><rect x="635" y="125" width="170" height="82" rx="12" fill="#fff0db" stroke="#324867" stroke-width="1.5"/><text x="720" y="156" text-anchor="middle" class="title">Conv2</text><text x="720" y="181" text-anchor="middle" class="sub">4×14×6 byte</text><rect x="840" y="125" width="140" height="82" rx="12" fill="#f0e9ff" stroke="#324867" stroke-width="1.5"/><text x="910" y="156" text-anchor="middle" class="title">FC / OCR</text><text x="910" y="181" text-anchor="middle" class="sub">30 lớp</text><path d="M192 166 L225 166" fill="none" stroke="#314968" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M395 166 L430 166" fill="none" stroke="#314968" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M600 166 L635 166" fill="none" stroke="#314968" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M805 166 L840 166" fill="none" stroke="#314968" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="30" y="285" class="foot">JTAG frame-loading đã có; pixel-stream Conv1/Conv2 là kiến trúc đề xuất, chưa post-fit.</text>
</svg>