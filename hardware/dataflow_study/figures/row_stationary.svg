<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Row-stationary (RS)</title><desc id="desc">Dữ liệu hàng của cửa sổ tích chập, trọng số hàng và tổng từng phần được tái sử dụng cục bộ qua PE lân cận.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#314968"/></marker></defs>
<style>.heading{font:600 23px Arial,sans-serif;fill:#172b4d}.title{font:600 17px Arial,sans-serif;fill:#172b4d}.sub{font:14px Arial,sans-serif;fill:#334155}.label{font:14px Arial,sans-serif;fill:#334155}.foot{font:14px Arial,sans-serif;fill:#334155}</style>
<rect width="1000" height="300" rx="18" fill="#f7f9fc"/>
<text x="30" y="42" class="heading">Row-stationary (RS)</text>
<rect x="25" y="125" width="170" height="82" rx="12" fill="#e7f8ec" stroke="#324867" stroke-width="1.5"/><text x="110" y="156" text-anchor="middle" class="title">Luồng pixel</text><text x="110" y="181" text-anchor="middle" class="sub">1 phần tử / nhịp</text><rect x="235" y="125" width="180" height="82" rx="12" fill="#e4f1ff" stroke="#324867" stroke-width="1.5"/><text x="325" y="156" text-anchor="middle" class="title">Line buffer</text><text x="325" y="181" text-anchor="middle" class="sub">4 hàng + cửa sổ 5×5</text><rect x="455" y="125" width="190" height="82" rx="12" fill="#fff0db" stroke="#324867" stroke-width="1.5"/><text x="550" y="156" text-anchor="middle" class="title">PE theo hàng</text><text x="550" y="181" text-anchor="middle" class="sub">giữ 5 W, dùng lại X</text><rect x="690" y="125" width="275" height="82" rx="12" fill="#f0e9ff" stroke="#324867" stroke-width="1.5"/><text x="827" y="156" text-anchor="middle" class="title">Cộng psum lân cận</text><text x="827" y="181" text-anchor="middle" class="sub">ghép 5 hàng và các kênh</text><path d="M195 166 L235 166" fill="none" stroke="#314968" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M415 166 L455 166" fill="none" stroke="#314968" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M645 166 L690 166" fill="none" stroke="#314968" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="30" y="285" class="foot">Giảm chuyển dữ liệu ở nhiều cấp; cần line buffer, mạng PE và lịch ánh xạ tile.</text>
</svg>